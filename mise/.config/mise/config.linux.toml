# Homebrew owns these CLI tools on macOS. This manifest is loaded only on Linux.
[settings]
# Coding agents can use new releases immediately; other tools keep the default delay.
minimum_release_age_excludes = ["claude", "codex", "opencode"]

[tools]
# Package and development tooling
uv = "latest"
gh = "latest"
neovim = "latest"
tmux = "latest"
direnv = "latest"
jq = "latest"
fzf = "latest"
zoxide = "latest"
starship = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
eza = "latest"
delta = "latest"
lazygit = "latest"
gitui = "latest"

# Coding agents
claude = "latest"
codex = "latest"
opencode = "latest"
