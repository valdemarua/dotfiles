[settings]
# Read .ruby-version, .nvmrc, .node-version etc.
idiomatic_version_file_enable_tools = ["ruby", "node"]

[settings.ruby]
compile = false

[settings.node]
compile = false

# Language runtimes are managed by mise on both macOS and Linux.
[tools]
ruby = "4"
node = "lts"
go = "latest"
rust = "stable"
bun = "latest"
