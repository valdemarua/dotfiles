#
# List of plugins
#
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'smart-splits-nvim/backend-tmux'
set -g @smart-splits_at_edge 'wrap'
# set -g @pl1gin 'tmux-plugins/tmux-sensible'
# Themes
# set -g @plugin 'dracula/tmux'
# set -g @plugin 'egel/tmux-gruvbox'
# set -g @plugin 'Determinant/tmux-colortag'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

#
# Tmux settings
#

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix

# Reload tmux config
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

#
# Status bar styling
#

# Move status bar to the top
set-option -g status-position top
# Gruvbox-inspired status bar
set -g status-style 'bg=#282828,fg=#a89984,nounderscore'
set -g message-style 'bg=#d79921,fg=#282828,bold'
set -g message-command-style 'bg=#d79921,fg=#282828,bold'

# Identify the session and show the active pane's folder once, outside the tabs.
# Keep folder labels shorter on mobile; ~ is clearer than the home directory name.
set -g @status-folder '#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}}'
set -g status-left-length 80
set -g status-left '#{?SSH_CONNECTION,#[fg=#282828]#[bg=#d79921]#[bold] SSH #[fg=#ebdbb2]#[bg=#076678] #{user}@#{host_short} ,#[fg=#ebdbb2]#[bg=#3c3836] #S }#[fg=#ebdbb2]#[bg=#3c3836]#[nobold] #{?#{e|<:#{client_width},80},#{=/12/..:#{E:@status-folder}},#{=/24/..:#{E:@status-folder}}} #[fg=#a89984]#[bg=#282828]'

# Window tabs
set -g window-status-separator ''
set -g window-status-style 'fg=#a89984,bg=#282828,nounderscore'
set -g window-status-current-style 'fg=#fbf1c7,bg=#458588,bold,nounderscore'
set -g window-status-format '#[fg=#a89984]#[bg=#282828] #I:#W#{?window_flags,#F,} '
set -g window-status-current-format '#[nounderscore]#[fg=#fbf1c7]#[bg=#458588]#[bold] #I:#W#{?window_zoomed_flag, Z,} '
set -g window-status-activity-style 'fg=#d79921,bg=#282828,bold'
set -g window-status-bell-style 'fg=#fb4934,bg=#282828,bold'

# Hide the clock on narrow screens to leave room for the folder and active tab.
set -g status-right-length 80
set -g status-right '#{?window_bigger,#[fg=#fabd2f] [#{window_offset_x}#,#{window_offset_y}] ,}#{?#{e|>=:#{client_width},100},#[fg=#ebdbb2]#[bg=#3c3836] %a %d %b #[fg=#282828]#[bg=#d79921]#[bold] %H:%M %Z ,}'

# Pane borders
set -g pane-border-style 'fg=#504945'
set -g pane-active-border-style 'bg=default,fg=#d79921'


# Enable mouse support
set -g mouse on

# Claude Code: let Shift+Enter reach apps as a distinct key, and let
# notifications and the progress bar pass through to the outer terminal.
# Detach and reattach after reloading for terminal-features to apply.
set -g allow-passthrough on
set -g focus-events on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

#
# Dracula theme settings
# https://draculatheme.com/tmux
#
set -g @dracula-plugins "battery cpu-usage git network weather time"
set -g @dracula-show-fahrenheit false
set -g @dracula-show-timezone false
set -g @dracula-day-month true
set -g @dracula-military-time true

#
# Gruvbox theme
#
# set -g @tmux-gruvbox 'dark' # or 'light'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
