#
# List of plugins
#
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'smart-splits-nvim/backend-tmux'
set -g @smart-splits_at_edge 'wrap'
# set -g @pl1gin 'tmux-plugins/tmux-sensible'
# Themes
# set -g @plugin 'dracula/tmux'
# set -g @plugin 'egel/tmux-gruvbox'
# set -g @plugin 'Determinant/tmux-colortag'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

#
# Tmux settings
#

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix

# Reload tmux config
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

#
# Status bar styling
#

# Move status bar to the top
set-option -g status-position top
# Main colors
set -g status-bg colour236
set -g status-fg colour15
# Show a persistent, high-contrast host badge when tmux was started over SSH.
set -g status-left-length 80
set -g status-left '#{?SSH_CONNECTION,#[fg=colour232]#[bg=colour214]#[bold] SSH #[fg=colour231]#[bg=colour24] #{user}@#{host_short} #[default] ,}#[fg=colour250]#S #[default]'
# Current window tab
set-window-option -g window-status-current-style bg=colour33,fg=colour231
# Right corner
# set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,} %c"
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,} %a %d %b %H:%M "
# border colours
set -g pane-border-style fg=colour117
set -g pane-active-border-style bg=default,fg=colour33


# Enable mouse support
set -g mouse on

#
# Dracula theme settings
# https://draculatheme.com/tmux
#
set -g @dracula-plugins "battery cpu-usage git network weather time"
set -g @dracula-show-fahrenheit false
set -g @dracula-show-timezone false
set -g @dracula-day-month true
set -g @dracula-military-time true

#
# Gruvbox theme
#
# set -g @tmux-gruvbox 'dark' # or 'light'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
